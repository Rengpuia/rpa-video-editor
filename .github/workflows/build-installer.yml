name: Build Windows Installer & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build RPA Video Editor Windows Setup
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Code & Check Cleanroom
        run: |
          node --check client/src/app.js
          node --check client/src/compositor.js
          node --check client/src/timeline.js
          node --check client/src/recorder.js
          node --check server/server.js
          node --check server/mcp_handler.js
          node --check mcp_server.js

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup -y --no-progress

      - name: Compile Inno Setup Script
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Verify Generated Installer
        run: |
          Get-ChildItem -Path exports/

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPA_Video_Editor_Setup_v2.0.0
          path: exports/RPA_Video_Editor_Setup_v2.0.0.exe

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: exports/RPA_Video_Editor_Setup_v2.0.0.exe
          name: RPA Video Editor ${{ github.ref_name }}
          body: |
            ## RPA Video Editor - Studio Pro v2.0.0
            **Developer:** K Vanlalrengpuia (<rengakhiangte@gmail.com>)
            **License:** Open Source (MIT)

            ### Highlights
            - Independent Cleanroom Architecture: Zero proprietary code, assets, or trademarks.
            - Extended Resolution Presets: 8K, 4K, 2K, 1080p, 720p, 480p, 9:16 Vertical, 1:1 Square, 4:5 Portrait, 21:9 Ultrawide, and Custom dimensions with Aspect Lock.
            - Text Alignment: Full Horizontal (Left/Center/Right/Justify) and Vertical (Top/Middle/Bottom) dropdowns.
            - Webcam Overlays & Effects: Device enumeration, Circle, Squircle, Hexagon, Diamond, Oval masks, custom size, borders, drop shadows, mirror flip.
            - Model Context Protocol (MCP): Integrated JSON-RPC 2.0 stdio server (`mcp_server.js`) & HTTP API (`/api/mcp`).
            - Performance: Desynchronized canvas GPU acceleration, idle render loop gating, and text metrics LRU caching.
          draft: false
          prerelease: false
