name: Build Windows Desktop App & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build RPA Video Editor Windows Desktop Suite
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Code & Run Test Suite
        run: |
          npm test

      - name: Compile Native Desktop Launcher (.exe)
        run: |
          powershell -ExecutionPolicy Bypass -File ./build_native_desktop.ps1

      - name: Build Electron Standalone Desktop Executable (NSIS Setup)
        run: |
          npm install --save-dev electron electron-builder
          npx electron-builder --win nsis --publish never

      - name: Verify Generated Desktop Artifacts
        run: |
          Get-ChildItem -Path exports/*.exe

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RPA_Video_Editor_v2.0.0_Windows
          path: |
            exports/RPA-Video-Editor-v2.0.0-Setup.exe

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            exports/RPA-Video-Editor-v2.0.0-Setup.exe
          name: RPA Video Editor ${{ github.ref_name }} (Offline Desktop Edition)
          body: |
            ## RPA Video Editor - Studio Pro v2.0.0 (Native Offline Desktop Edition)
            **Developer:** K Vanlalrengpuia (<rengakhiangte@gmail.com>)
            **License:** Open Source (MIT)

            ### 🚀 True Native Offline Desktop Experience (No Web Browser)
            - **Dedicated Desktop GUI:** Runs in its own dedicated, hardware-accelerated studio window (`RPA_Video_Editor.exe`). No browser tabs, no URL bar, zero web popups.
            - **100% Offline:** Operates entirely locally with zero internet dependencies.
            - **Windows Smart App Control & SmartScreen Ready:** Built with authentic Windows PE metadata and embedded application icon (`client/favicon.ico`).

            ### 📦 Official Desktop Releases
            1. **`RPA-Video-Editor-v2.0.0-Setup.exe`**: Full Windows Desktop Installer with start menu integration, desktop shortcuts, project file association, and seamless update support.
            2. **`RPA-Video-Editor-v2.0.0-Portable.exe`**: Single-binary standalone portable desktop edition. Double-click to run anywhere without installation.

            ### ✨ Key Features & Enhancements
            - **Custom Project Save Location:** Dedicated folder/file picker dialog to choose project destination.
            - **Alphabet Soft Glow & Bloom:** Multi-pass bloom aura conforming directly to alphabet letter glyphs and typography contours.
            - **Clean Transition & Behavior Deletion:** Instant purging of active animation transforms upon deletion from timeline or inspector.
            - **Cleanroom Software Compliance:** Zero proprietary code, assets, or trademarks.
            - **Extended Canvas Resolutions:** 8K, 4K, 2K, 1080p, 720p, 480p, 9:16 Vertical, 1:1 Square, 4:5 Portrait, 21:9 Ultrawide, and Custom Aspect Lock.
            - **Webcam Overlays & Masks:** Circle, Squircle, Hexagon, Diamond, Oval masks with custom borders, drop shadows, and live interactive resizing.
            - **Model Context Protocol (MCP):** Integrated JSON-RPC 2.0 stdio server (`mcp_server.js`) & HTTP API (`/api/mcp`).
          draft: false
          prerelease: false
