name: Build Windows Desktop App & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build RPA Video Editor Windows Desktop Suite
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v24 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Code & Run Test Suite
        run: |
          npm test

      - name: Compile Native Desktop Launcher (.exe)
        run: |
          powershell -ExecutionPolicy Bypass -File ./build_native_desktop.ps1

      - name: Build Electron Standalone Desktop Executable (NSIS Setup)
        run: |
          npm install --save-dev electron electron-builder
          npx electron-builder --win nsis --publish never

      - name: Verify Generated Desktop Artifacts
        run: |
          Get-ChildItem -Path exports/*.exe -ErrorAction SilentlyContinue
          if (Test-Path RPA_Video_Editor.exe) { Write-Host "Verified native launcher: RPA_Video_Editor.exe" }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RPA_Video_Editor_v2.0.0_Windows
          path: |
            exports/*.exe
            RPA_Video_Editor.exe

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            exports/*.exe
            RPA_Video_Editor.exe
          name: RPA Video Editor ${{ github.ref_name }} (Offline Desktop Edition)
          body: |
            ## RPA Video Editor - Studio Pro v2.0.0 (Native Offline Desktop Edition)
            **Developer:** K Vanlalrengpuia (<rengakhiangte@gmail.com>)
            **License:** Open Source (MIT)

            ### 🚀 True Native Offline Desktop Experience (No Web Browser)
            - **Dedicated Desktop GUI:** Runs in its own dedicated, hardware-accelerated studio window (`RPA_Video_Editor.exe`). No browser tabs, no URL bar, zero web popups.
            - **100% Offline:** Operates entirely locally with zero internet dependencies.
            - **Windows Smart App Control & SmartScreen Ready:** Built with authentic Windows PE metadata and embedded application icon (`client/favicon.ico`).

            ### 📦 Official Desktop Releases
            1. **`RPA-Video-Editor-v2.0.0-Setup.exe`**: Full Windows Desktop Installer with start menu integration, desktop shortcuts, project file association, and seamless update support.
            2. **`RPA_Video_Editor.exe`**: Native C# compiled standalone portable launcher. Double-click to run anywhere without installation.

            ### ✨ Key Features & Enhancements
            - **Studio-Grade Export Quality:** Bicubic high-DPI canvas smoothing, geometric precision typography, and up to 48 Mbps / 4K encoding (20 Mbps recommended default).
            - **Zero-Glitch WebM Seeking:** 64-bit safe EBML writeVint, front-loaded SeekHead, accurate Duration header, and video track keyframe Cues index table for instant, artifact-free scrubbing in external PC media players.
            - **Transition Trimming & Opacity Controls:** Dedicated interactive wedge resize handles for entrance/exit transitions and customizable Transition Opacity (10%–100%).
            - **Transitions on Blur & Magnify:** Transitions seamlessly apply to Blur Sensitive and Magnify tools without player freezing.
            - **True Feathered Magnify Blur Outline:** Gaussian-blurred edge mask with outer bleed margin seamlessly blends the magnified lens into underlying video.
            - **Synchronized Manual Track Points:** Full interpolation and timeline synchronization for keyframed motion track points in Magnify lens with one-click Record Point @ Current Time.
            - **Vector-Property Keyframing & Animation Arrows:** Vector property interpolation (position X/Y, scale, rotation, opacity) with visual timeline arrows, easing, Jump Tail/Head and Set Start/End State.
            - **Isolated Behavior Styles:** IN, DURING (None/Still, Pulsate, Jitter/Shake, Drift, Jump, Swing), and OUT styles operate completely independently without unwanted wave ripple or drift mixing; centered default placement.
            - **Toolbar Click Animation Polish:** Instant focus outline and active state cleanup across all timeline action buttons.
            - **Custom Project Save Location:** Dedicated folder/file picker dialog to choose project destination.
            - **Alphabet Soft Glow & Bloom:** Multi-pass bloom aura conforming directly to alphabet letter glyphs and typography contours.
            - **Clean Transition & Behavior Deletion:** Instant purging of active animation transforms upon deletion from timeline or inspector.
            - **Cleanroom Software Compliance:** Zero proprietary code, assets, or trademarks.
            - **Extended Canvas Resolutions:** 8K, 4K, 2K, 1080p, 720p, 480p, 9:16 Vertical, 1:1 Square, 4:5 Portrait, 21:9 Ultrawide, and Custom Aspect Lock.
            - **Webcam Overlays & Masks:** Circle, Squircle, Hexagon, Diamond, Oval masks with custom borders, drop shadows, and live interactive resizing.
            - **Model Context Protocol (MCP):** Integrated JSON-RPC 2.0 stdio server (`mcp_server.js`) & HTTP API (`/api/mcp`).
          draft: false
          prerelease: false
